<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joanna的练琴打卡</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .title {
            font-size: 32px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 14px;
            color: #999;
        }

        .piano-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .stats-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            padding: 20px;
            color: white;
            text-align: center;
        }

        .stat-label {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 36px;
            font-weight: bold;
        }

        .form-section {
            margin-bottom: 30px;
        }

        .form-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 14px;
            color: #555;
            margin-bottom: 8px;
            font-weight: 500;
        }

        input[type="text"],
        input[type="number"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        input[type="date"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 30px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .btn-checkin {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            grid-column: 1 / -1;
        }

        .btn-checkin:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-checkin:active {
            transform: translateY(0);
        }

        .btn-delete {
            background: #ff6b6b;
            color: white;
        }

        .btn-delete:hover {
            background: #ff5252;
        }

        .btn-export {
            background: #4ecdc4;
            color: white;
        }

        .btn-export:hover {
            background: #45b3aa;
        }

        .records-section {
            margin-top: 40px;
        }

        .sync-panel { background: #f5f6ff; border-radius: 12px; padding: 16px; margin: -20px 0 28px; }
        .sync-panel p { color: #666; font-size: 13px; line-height: 1.5; margin: 8px 0; }
        .sync-row { display: flex; gap: 8px; flex-wrap: wrap; }
        .sync-row input { flex: 1; min-width: 130px; }
        .sync-status { font-size: 13px; color: #667eea; margin-top: 8px; }
        .btn-sync { background: #667eea; color: white; }

        .records-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
        }

        .record-item {
            background: #f9f9f9;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 12px;
            position: relative;
        }

        .record-date {
            font-size: 14px;
            color: #999;
            margin-bottom: 8px;
        }

        .record-practice {
            font-size: 16px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .record-duration {
            font-size: 14px;
            color: #667eea;
            margin-bottom: 8px;
        }

        .record-notes {
            font-size: 13px;
            color: #666;
            line-height: 1.5;
            margin-bottom: 10px;
        }

        .record-delete {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .record-delete:hover {
            background: #ff5252;
            transform: scale(1.1);
        }

        .empty-state {
            text-align: center;
            padding: 30px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .consecutive-days {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .total-minutes {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .title {
                font-size: 24px;
            }

            .stats-container {
                grid-template-columns: 1fr;
            }

            .button-group {
                grid-template-columns: 1fr;
            }

            .btn-checkin {
                grid-column: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="piano-icon">🎹</div>
            <div class="title">Joanna的练琴打卡</div>
            <div class="subtitle">坚持每一次练习，成就更好的自己</div>
        </div>

        <section class="sync-panel">
            <strong>☁️ 多设备同步</strong>
            <p>首次使用需填写 Supabase 项目地址和 anon key；手机、电脑使用同一个邮箱账号登录即可共享记录。</p>
            <div class="sync-row" id="syncConfigRow">
                <input id="supabaseUrl" type="text" placeholder="Supabase 项目 URL">
                <input id="supabaseKey" type="text" placeholder="Supabase anon / publishable key">
            </div>
            <div class="sync-row" id="syncAuthRow" style="margin-top:8px">
                <input id="syncEmail" type="text" placeholder="同步邮箱">
                <input id="syncPassword" type="password" placeholder="密码（至少 6 位）">
                <button class="btn-sync" onclick="signIn()">登录 / 注册</button>
                <button onclick="signOut()">退出</button>
            </div>
            <div class="sync-row" id="syncLogoutRow" style="margin-top:8px;display:none">
                <button onclick="signOut()">切换账号 / 退出</button>
            </div>
            <div id="syncStatus" class="sync-status">当前为本机保存模式</div>
        </section>

        <div class="stats-container">
            <div class="stat-card consecutive-days">
                <div class="stat-label">连续打卡天数</div>
                <div class="stat-value" id="consecutiveDays">0</div>
            </div>
            <div class="stat-card total-minutes">
                <div class="stat-label">总练习时长</div>
                <div class="stat-value" id="totalMinutes">0</div>
                <div class="stat-label" style="margin-top: 8px;">分钟</div>
            </div>
        </div>

        <div class="form-section">
            <div class="form-title">📝 记录今天的练习</div>
            
            <div class="form-group">
                <label for="practiceDate">练习日期</label>
                <input type="date" id="practiceDate">
            </div>

            <div class="form-group">
                <label for="practiceType">练习类型</label>
                <select id="practiceType">
                    <option value="">-- 选择类型 --</option>
                    <option value="基础练习">基础练习</option>
                    <option value="音阶">音阶</option>
                    <option value="琶音">琶音</option>
                    <option value="曲目">曲目</option>
                    <option value="视奏">视奏</option>
                    <option value="乐理">乐理</option>
                    <option value="其他">其他</option>
                </select>
            </div>

            <div class="form-group">
                <label for="practiceTime">练习时长（分钟）</label>
                <input type="number" id="practiceTime" placeholder="请输入分钟数" min="1">
            </div>

            <div class="form-group">
                <label for="practiceNotes">练习笔记（可选）</label>
                <textarea id="practiceNotes" placeholder="记录今天的练习内容、��受或心得..."></textarea>
            </div>

            <div class="button-group">
                <button class="btn-checkin" onclick="addRecord()">✨ 打卡记录</button>
            </div>

            <div class="button-group">
                <button class="btn-export" onclick="exportData()">📥 导出数据</button>
                <button class="btn-delete" onclick="clearAllData()">🗑️ 清空所有</button>
            </div>
        </div>

        <div class="records-section">
            <div class="records-title">📅 练习记录</div>
            <div id="recordsList"></div>
        </div>
    </div>

    <script>
        let supabaseClient = null;
        let syncBusy = false;
        document.addEventListener('DOMContentLoaded', async function() {
            setTodayDate();
            document.getElementById('supabaseUrl').value = localStorage.getItem('supabaseUrl') || '';
            document.getElementById('supabaseKey').value = localStorage.getItem('supabaseKey') || '';
            document.getElementById('syncEmail').value = localStorage.getItem('syncEmail') || '';
            loadRecords();
            updateStats();
            await loadSupabaseLibrary();
        });

        function setSyncStatus(message) { document.getElementById('syncStatus').textContent = message; }
        function loadSupabaseLibrary() {
            return new Promise((resolve) => {
                const script = document.createElement('script');
                script.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
                script.onload = async () => { await connectSavedAccount(); resolve(); };
                script.onerror = () => { setSyncStatus('同步组件加载失败，请检查网络；本机记录仍可使用'); resolve(); };
                document.head.appendChild(script);
            });
        }
        async function connectSavedAccount() {
            const url = localStorage.getItem('supabaseUrl');
            const key = localStorage.getItem('supabaseKey');
            if (!url || !key || !window.supabase) return;
            supabaseClient = window.supabase.createClient(url, key);
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                document.getElementById('syncEmail').value = session.user.email || '';
                setSyncStatus('已自动连接云端 · ' + session.user.email);
                renderSyncState(true);
                await syncRecords();
            }
        }
        function renderSyncState(connected) {
            document.getElementById('syncConfigRow').style.display = connected ? 'none' : 'flex';
            document.getElementById('syncAuthRow').style.display = connected ? 'none' : 'flex';
            document.getElementById('syncLogoutRow').style.display = connected ? 'flex' : 'none';
        }
        async function signIn() {
            const url = document.getElementById('supabaseUrl').value.trim();
            const key = document.getElementById('supabaseKey').value.trim();
            const email = document.getElementById('syncEmail').value.trim();
            const password = document.getElementById('syncPassword').value;
            if (!url || !key || !email || password.length < 6) return alert('请填写项目 URL、anon key、邮箱和至少 6 位密码');
            if (!window.supabase) return alert('同步组件尚未加载，请刷新页面后重试');
            localStorage.setItem('supabaseUrl', url); localStorage.setItem('supabaseKey', key);
            localStorage.setItem('syncEmail', email);
            supabaseClient = window.supabase.createClient(url, key);
            setSyncStatus('正在连接云端…');
            let result = await supabaseClient.auth.signInWithPassword({ email, password });
            if (result.error && /invalid login credentials/i.test(result.error.message)) {
                result = await supabaseClient.auth.signUp({ email, password });
            }
            if (result.error) { setSyncStatus('连接失败：' + result.error.message); return; }
            if (!result.data.session) { setSyncStatus('请先到邮箱确认注册，再返回登录'); return; }
            await syncRecords();
            setSyncStatus('已连接云端 · ' + email);
            renderSyncState(true);
        }
        async function signOut() {
            if (supabaseClient) await supabaseClient.auth.signOut();
            supabaseClient = null; renderSyncState(false); setSyncStatus('已退出云端，本机记录保留');
        }
        async function syncRecords() {
            if (!supabaseClient || syncBusy) return;
            syncBusy = true;
            try {
                const { data: { user } } = await supabaseClient.auth.getUser();
                if (!user) return;
                const { data: remote, error } = await supabaseClient.from('piano_records').select('*').eq('user_id', user.id);
                if (error) throw error;
                const deletedIds = new Set(remote.filter(r => r.deleted_at).map(r => String(r.id)));
                const local = getRecords().filter(r => !deletedIds.has(String(r.id)));
                if (!remote.length && local.length) {
                    const rows = local.map(r => ({ id: String(r.id), user_id: user.id, practice_date: r.date, practice_type: r.type, minutes: r.time, notes: r.notes || '', created_at: r.createdAt || new Date().toISOString() }));
                    const { error: uploadError } = await supabaseClient.from('piano_records').upsert(rows);
                    if (uploadError) throw uploadError;
                } else {
                    const remoteIds = new Set(remote.map(r => String(r.id)));
                    const uploads = local.filter(r => !remoteIds.has(String(r.id))).map(r => ({ id: String(r.id), user_id: user.id, practice_date: r.date, practice_type: r.type, minutes: r.time, notes: r.notes || '', created_at: r.createdAt || new Date().toISOString() }));
                    if (uploads.length) { const { error: uploadError } = await supabaseClient.from('piano_records').upsert(uploads); if (uploadError) throw uploadError; }
                    const all = [...remote.filter(r => !r.deleted_at && !local.some(l => String(l.id) === String(r.id))).map(r => ({ id: r.id, date: r.practice_date, type: r.practice_type, time: r.minutes, notes: r.notes, createdAt: r.created_at })), ...local];
                    localStorage.setItem('pianoRecords', JSON.stringify(all));
                }
                loadRecords(); updateStats();
            } catch (error) { setSyncStatus('同步失败：' + error.message); }
            finally { syncBusy = false; }
        }

        // 设置今天的日期
        function setTodayDate() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('practiceDate').value = today;
        }

        // 添加记录
        async function addRecord() {
            const date = document.getElementById('practiceDate').value;
            const type = document.getElementById('practiceType').value;
            const time = document.getElementById('practiceTime').value;
            const notes = document.getElementById('practiceNotes').value;

            if (!date || !type || !time) {
                alert('请填写日期、练习类型和练习时长');
                return;
            }

            const records = getRecords();
            records.push({
                id: Date.now(),
                date: date,
                type: type,
                time: parseInt(time),
                notes: notes,
                createdAt: new Date().toISOString()
            });

            saveRecords(records);
            await pushRecord(records[records.length - 1]);
            clearForm();
            loadRecords();
            updateStats();
            showNotification('✨ 打卡成功！坚持就是胜利！');
        }

        // 删除记录
        async function deleteRecord(id) {
            if (confirm('确定要删除这条记录吗？')) {
                let records = getRecords();
                records = records.filter(r => r.id !== id);
                saveRecords(records);
                if (supabaseClient) { const { data: { user } } = await supabaseClient.auth.getUser(); if (user) await supabaseClient.from('piano_records').update({ deleted_at: new Date().toISOString() }).eq('id', String(id)).eq('user_id', user.id); }
                loadRecords();
                updateStats();
                showNotification('已删除记录');
            }
        }

        // 清空所有数据
        async function clearAllData() {
            if (confirm('确定要清空所有记录吗？此操作不可恢复！')) {
                saveRecords([]);
                if (supabaseClient) { const { data: { user } } = await supabaseClient.auth.getUser(); if (user) await supabaseClient.from('piano_records').update({ deleted_at: new Date().toISOString() }).eq('user_id', user.id).is('deleted_at', null); }
                loadRecords();
                updateStats();
                showNotification('已清空所有数据');
            }
        }

        // 导出数据
        function exportData() {
            const records = getRecords();
            if (records.length === 0) {
                alert('还没有记录，快去打卡吧！');
                return;
            }

            let csvContent = 'data:text/csv;charset=utf-8,';
            csvContent += '日期,练习类型,时长(分钟),笔记\n';
            
            records.forEach(record => {
                const date = new Date(record.date).toLocaleDateString('zh-CN');
                const notes = record.notes.replace(/"/g, '""');
                csvContent += `${date},${record.type},${record.time},"${notes}"\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement('a');
            link.setAttribute('href', encodedUri);
            link.setAttribute('download', `Joanna练琴记录_${new Date().toLocaleDateString('zh-CN')}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showNotification('📥 数据导出成功！');
        }

        // 加载记录
        function loadRecords() {
            const records = getRecords();
            const recordsList = document.getElementById('recordsList');

            if (records.length === 0) {
                recordsList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🎼</div>
                        <p>还没有练习记录呢</p>
                        <p style="font-size: 12px; margin-top: 5px;">快去练琴，记录下你的进步吧！</p>
                    </div>
                `;
                return;
            }

            // 按日期倒序排序
            records.sort((a, b) => new Date(b.date) - new Date(a.date));

            recordsList.innerHTML = records.map(record => `
                <div class="record-item">
                    <button class="record-delete" onclick="deleteRecord(${record.id})">×</button>
                    <div class="record-date">${formatDate(record.date)}</div>
                    <div class="record-practice">🎹 ${record.type}</div>
                    <div class="record-duration">⏱️ ${record.time} 分钟</div>
                    ${record.notes ? `<div class="record-notes">💭 ${record.notes}</div>` : ''}
                </div>
            `).join('');
        }

        // 更新统计数据
        function updateStats() {
            const records = getRecords();

            // 计算总时长
            const totalMinutes = records.reduce((sum, r) => sum + r.time, 0);
            document.getElementById('totalMinutes').textContent = totalMinutes;

            // 计算连续打卡天数
            const consecutiveDays = calculateConsecutiveDays(records);
            document.getElementById('consecutiveDays').textContent = consecutiveDays;
        }

        // 计算连续打卡天数
        function calculateConsecutiveDays(records) {
            if (records.length === 0) return 0;

            // 获取所有不同的日期
            const dates = [...new Set(records.map(r => r.date))];
            dates.sort((a, b) => new Date(b) - new Date(a));

            let consecutive = 1;
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            let currentDate = new Date(dates[0]);
            currentDate.setHours(0, 0, 0, 0);

            // 检查是否连续
            for (let i = 1; i < dates.length; i++) {
                let nextDate = new Date(dates[i]);
                nextDate.setHours(0, 0, 0, 0);
                
                const diffTime = currentDate - nextDate;
                const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));

                if (diffDays === 1) {
                    consecutive++;
                    currentDate = nextDate;
                } else {
                    break;
                }
            }

            return consecutive;
        }

        // 格式化日期
        function formatDate(dateStr) {
            const date = new Date(dateStr);
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const yesterday = new Date(today);
            yesterday.setDate(yesterday.getDate() - 1);

            const checkDate = new Date(dateStr);
            checkDate.setHours(0, 0, 0, 0);

            if (checkDate.getTime() === today.getTime()) {
                return '今天 ' + date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            } else if (checkDate.getTime() === yesterday.getTime()) {
                return '昨天 ' + date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            } else {
                return date.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' });
            }
        }

        // 清空表单
        function clearForm() {
            setTodayDate();
            document.getElementById('practiceType').value = '';
            document.getElementById('practiceTime').value = '';
            document.getElementById('practiceNotes').value = '';
        }

        // 获取所有记录
        function getRecords() {
            const data = localStorage.getItem('pianoRecords');
            return data ? JSON.parse(data) : [];
        }

        async function pushRecord(record) {
            if (!supabaseClient) return;
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) return;
            const { error } = await supabaseClient.from('piano_records').upsert({ id: String(record.id), user_id: user.id, practice_date: record.date, practice_type: record.type, minutes: record.time, notes: record.notes || '', created_at: record.createdAt || new Date().toISOString() });
            if (error) setSyncStatus('已保存在本机，云端同步失败：' + error.message);
        }

        setInterval(syncRecords, 15000);

        // 保存记录
        function saveRecords(records) {
            localStorage.setItem('pianoRecords', JSON.stringify(records));
        }

        // 显示通知
        function showNotification(message) {
            // 可以扩展为更好看的通知样式
            console.log(message);
        }
    </script>
</body>
</html>
