<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joanna的练琴打卡</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .title {
            font-size: 32px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 14px;
            color: #999;
        }

        .piano-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .stats-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            padding: 20px;
            color: white;
            text-align: center;
        }

        .stat-label {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 36px;
            font-weight: bold;
        }

        .form-section {
            margin-bottom: 30px;
        }

        .form-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 14px;
            color: #555;
            margin-bottom: 8px;
            font-weight: 500;
        }

        input[type="text"],
        input[type="number"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        input[type="date"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 30px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .btn-checkin {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            grid-column: 1 / -1;
        }

        .btn-checkin:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-checkin:active {
            transform: translateY(0);
        }

        .btn-delete {
            background: #ff6b6b;
            color: white;
        }

        .btn-delete:hover {
            background: #ff5252;
        }

        .btn-export {
            background: #4ecdc4;
            color: white;
        }

        .btn-export:hover {
            background: #45b3aa;
        }

        .records-section {
            margin-top: 40px;
        }

        .records-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
        }

        .record-item {
            background: #f9f9f9;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 12px;
            position: relative;
        }

        .record-date {
            font-size: 14px;
            color: #999;
            margin-bottom: 8px;
        }

        .record-practice {
            font-size: 16px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .record-duration {
            font-size: 14px;
            color: #667eea;
            margin-bottom: 8px;
        }

        .record-notes {
            font-size: 13px;
            color: #666;
            line-height: 1.5;
            margin-bottom: 10px;
        }

        .record-delete {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .record-delete:hover {
            background: #ff5252;
            transform: scale(1.1);
        }

        .empty-state {
            text-align: center;
            padding: 30px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .consecutive-days {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .total-minutes {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .title {
                font-size: 24px;
            }

            .stats-container {
                grid-template-columns: 1fr;
            }

            .button-group {
                grid-template-columns: 1fr;
            }

            .btn-checkin {
                grid-column: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="piano-icon">🎹</div>
            <div class="title">Joanna的练琴打卡</div>
            <div class="subtitle">坚持每一次练习，成就更好的自己</div>
        </div>

        <div class="stats-container">
            <div class="stat-card consecutive-days">
                <div class="stat-label">连续打卡天数</div>
                <div class="stat-value" id="consecutiveDays">0</div>
            </div>
            <div class="stat-card total-minutes">
                <div class="stat-label">总练习时长</div>
                <div class="stat-value" id="totalMinutes">0</div>
                <div class="stat-label" style="margin-top: 8px;">分钟</div>
            </div>
        </div>

        <div class="form-section">
            <div class="form-title">📝 记录今天的练习</div>
            
            <div class="form-group">
                <label for="practiceDate">练习日期</label>
                <input type="date" id="practiceDate">
            </div>

            <div class="form-group">
                <label for="practiceType">练习类型</label>
                <select id="practiceType">
                    <option value="">-- 选择类型 --</option>
                    <option value="基础练习">基础练习</option>
                    <option value="音阶">音阶</option>
                    <option value="琶音">琶音</option>
                    <option value="曲目">曲目</option>
                    <option value="视奏">视奏</option>
                    <option value="乐理">乐理</option>
                    <option value="其他">其他</option>
                </select>
            </div>

            <div class="form-group">
                <label for="practiceTime">练习时长（分钟）</label>
                <input type="number" id="practiceTime" placeholder="请输入分钟数" min="1">
            </div>

            <div class="form-group">
                <label for="practiceNotes">练习笔记（可选）</label>
                <textarea id="practiceNotes" placeholder="记录今天的练习内容、��受或心得..."></textarea>
            </div>

            <div class="button-group">
                <button class="btn-checkin" onclick="addRecord()">✨ 打卡记录</button>
            </div>

            <div class="button-group">
                <button class="btn-export" onclick="exportData()">📥 导出数据</button>
                <button class="btn-delete" onclick="clearAllData()">🗑️ 清空所有</button>
            </div>
        </div>

        <div class="records-section">
            <div class="records-title">📅 练习记录</div>
            <div id="recordsList"></div>
        </div>
    </div>

    <script>
        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            setTodayDate();
            loadRecords();
            updateStats();
        });

        // 设置今天的日期
        function setTodayDate() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('practiceDate').value = today;
        }

        // 添加记录
        function addRecord() {
            const date = document.getElementById('practiceDate').value;
            const type = document.getElementById('practiceType').value;
            const time = document.getElementById('practiceTime').value;
            const notes = document.getElementById('practiceNotes').value;

            if (!date || !type || !time) {
                alert('请填写日期、练习类型和练习时长');
                return;
            }

            const records = getRecords();
            records.push({
                id: Date.now(),
                date: date,
                type: type,
                time: parseInt(time),
                notes: notes,
                createdAt: new Date().toISOString()
            });

            saveRecords(records);
            clearForm();
            loadRecords();
            updateStats();
            showNotification('✨ 打卡成功！坚持就是胜利！');
        }

        // 删除记录
        function deleteRecord(id) {
            if (confirm('确定要删除这条记录吗？')) {
                let records = getRecords();
                records = records.filter(r => r.id !== id);
                saveRecords(records);
                loadRecords();
                updateStats();
                showNotification('已删除记录');
            }
        }

        // 清空所有数据
        function clearAllData() {
            if (confirm('确定要清空所有记录吗？此操作不可恢复！')) {
                saveRecords([]);
                loadRecords();
                updateStats();
                showNotification('已清空所有数据');
            }
        }

        // 导出数据
        function exportData() {
            const records = getRecords();
            if (records.length === 0) {
                alert('还没有记录，快去打卡吧！');
                return;
            }

            let csvContent = 'data:text/csv;charset=utf-8,';
            csvContent += '日期,练习类型,时长(分钟),笔记\n';
            
            records.forEach(record => {
                const date = new Date(record.date).toLocaleDateString('zh-CN');
                const notes = record.notes.replace(/"/g, '""');
                csvContent += `${date},${record.type},${record.time},"${notes}"\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement('a');
            link.setAttribute('href', encodedUri);
            link.setAttribute('download', `Joanna练琴记录_${new Date().toLocaleDateString('zh-CN')}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showNotification('📥 数据导出成功！');
        }

        // 加载记录
        function loadRecords() {
            const records = getRecords();
            const recordsList = document.getElementById('recordsList');

            if (records.length === 0) {
                recordsList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🎼</div>
                        <p>还没有练习记录呢</p>
                        <p style="font-size: 12px; margin-top: 5px;">快去练琴，记录下你的进步吧！</p>
                    </div>
                `;
                return;
            }

            // 按日期倒序排序
            records.sort((a, b) => new Date(b.date) - new Date(a.date));

            recordsList.innerHTML = records.map(record => `
                <div class="record-item">
                    <button class="record-delete" onclick="deleteRecord(${record.id})">×</button>
                    <div class="record-date">${formatDate(record.date)}</div>
                    <div class="record-practice">🎹 ${record.type}</div>
                    <div class="record-duration">⏱️ ${record.time} 分钟</div>
                    ${record.notes ? `<div class="record-notes">💭 ${record.notes}</div>` : ''}
                </div>
            `).join('');
        }

        // 更新统计数据
        function updateStats() {
            const records = getRecords();

            // 计算总时长
            const totalMinutes = records.reduce((sum, r) => sum + r.time, 0);
            document.getElementById('totalMinutes').textContent = totalMinutes;

            // 计算连续打卡天数
            const consecutiveDays = calculateConsecutiveDays(records);
            document.getElementById('consecutiveDays').textContent = consecutiveDays;
        }

        // 计算连续打卡天数
        function calculateConsecutiveDays(records) {
            if (records.length === 0) return 0;

            // 获取所有不同的日期
            const dates = [...new Set(records.map(r => r.date))];
            dates.sort((a, b) => new Date(b) - new Date(a));

            let consecutive = 1;
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            let currentDate = new Date(dates[0]);
            currentDate.setHours(0, 0, 0, 0);

            // 检查是否连续
            for (let i = 1; i < dates.length; i++) {
                let nextDate = new Date(dates[i]);
                nextDate.setHours(0, 0, 0, 0);
                
                const diffTime = currentDate - nextDate;
                const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));

                if (diffDays === 1) {
                    consecutive++;
                    currentDate = nextDate;
                } else {
                    break;
                }
            }

            return consecutive;
        }

        // 格式化日期
        function formatDate(dateStr) {
            const date = new Date(dateStr);
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const yesterday = new Date(today);
            yesterday.setDate(yesterday.getDate() - 1);

            const checkDate = new Date(dateStr);
            checkDate.setHours(0, 0, 0, 0);

            if (checkDate.getTime() === today.getTime()) {
                return '今天 ' + date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            } else if (checkDate.getTime() === yesterday.getTime()) {
                return '昨天 ' + date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            } else {
                return date.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' });
            }
        }

        // 清空表单
        function clearForm() {
            setTodayDate();
            document.getElementById('practiceType').value = '';
            document.getElementById('practiceTime').value = '';
            document.getElementById('practiceNotes').value = '';
        }

        // 获取所有记录
        function getRecords() {
            const data = localStorage.getItem('pianoRecords');
            return data ? JSON.parse(data) : [];
        }

        // 保存记录
        function saveRecords(records) {
            localStorage.setItem('pianoRecords', JSON.stringify(records));
        }

        // 显示通知
        function showNotification(message) {
            // 可以扩展为更好看的通知样式
            console.log(message);
        }
    </script>
</body>
</html>
